# Snap-fit permissible strain by material. Sources: docs/research/R5d-dfm-additive-snapfit-pcb.md
# ("## Snap-fit permissible strain"). `allowable_strain_once_pct` is the
# single-assembly limit; `allowable_strain_frequent_pct` (where a source
# states one directly) is for repeated separation/rejoining. Where no
# material-specific frequent value is stated, checking-dfm/scripts/strain.py
# applies Covestro's default "~60% of the single-assembly value" factor
# (`frequent_use_factor` below) instead.
#
# Where Covestro (2019 snap-fit guide, [V] -- read directly off the PDF
# table) and BASF/DuPont ([R] -- reported, read from third-party PDF copies)
# disagree for the same or an equivalent material, the LOWER (more
# conservative -- stricter allowable-strain ceiling) value is kept as
# `allowable_strain_once_pct`, and the discarded figure is in `conflict`.
[meta]
formula_source = "Covestro snap-fit guide Table 1, p.9 (1557218421.pdf): y = k*eps*L^2/h, so eps = h*y/(k*L^2)"
frequent_use_factor = 0.6
frequent_use_factor_source = "Covestro snap-fit guide p.12: use ~60% of the single-assembly value for frequent separation/rejoining"
k_constant_rectangle = 0.67
k_tapered_to_half_thickness = 1.09
k_tapered_width_quarter = 0.86
k_source = "Covestro snap-fit guide Table 1, p.9"

[[material]]
id = "pc_makrolon"
name = "PC (Makrolon)"
allowable_strain_once_pct = 4.0
source = "Covestro snap-fit guide, Table 2, 23 C, single assembly, p.12"
conflict = "BASF Snap-Fit Design Manual gives PC 4-9.2% (a wider range); 4.0% (Covestro, [V]) kept as the conservative floor."

