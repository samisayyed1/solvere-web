applies_if = [ { field = "has_pcb", op = "true", value = true }, { field = "contract_manufactured", op = "true", value = true } ]
needs_human = "IPC-certified inspectors (CIS/CIT) for the actual inspection calls."

[[standard]]
id = "eu-rohs"
name = "EU RoHS -- restricted substances in EEE"
edition = "Directive 2011/65/EU + 2015/863; 2025 lead-exemption resets apply from 2026-07-01"
body = "EP & Council / European Commission"
source_file = "R5e"
trigger = "Any electrical/electronic equipment placed on the EU market."
applies_if = [ { field = "target_markets", op = "in", value = "EU" } ]
