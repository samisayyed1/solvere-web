# Standards applicability data (mapping-compliance skill).
#
# Every row's `edition`, `year` and `trigger` text traces to a specific
# Forge research file (R5a, R5b or R5e) -- never invented. `source_file`
# names exactly which one. Re-check `as_of` before trusting a row more than
# ~180 days old (R5e's own recommendation: "store dated snapshots, not
# 'current' claims").
#
# `applies_if`: a list of {field, op, value} predicates, ALL of which must
# hold against the product profile (compliance/product-profile.toml) for
# this standard to be flagged applicable. `op` is one of "eq", "in"
# (profile field is a list containing value), "true".
#
# This file states which standards exist and why they might apply. It is
# NOT a compliance determination -- see mapping-compliance/SKILL.md and
# every generated report for the required disclaimer.

as_of = "2026-09-25"

[[standard]]
id = "iec-62368-1"
name = "IEC/EN/UL 62368-1 -- audio/video, IT and communications equipment safety"
edition = "IEC Ed. 4.0 (2023-05-26); EN IEC 62368-1:2024+A11:2024 (EU); UL 62368-1 Ed. 4 (2025-07-31, US/Canada)"
body = "IEC TC 108 / CENELEC / UL Standards & Engagement / CSA"
source_file = "R5b"
trigger = "Any mains- or battery-powered AV/ICT product (chargers, PSUs, routers, sensors with a mains adapter)."
applies_if = [ { field = "power_source", op = "in", value = "mains" } ]
needs_human = "A test lab or certification body (NRTL, IECEE CB Scheme). In the EU, note the 2024 edition's OJ-harmonisation status is unresolved (R5b) -- ask a qualified human which edition to certify against."

[[standard]]
id = "iec-60601-1"
name = "IEC 60601-1 (+60601-1-2 EMC) -- medical electrical equipment basic safety"
edition = "Ed. 3.2 consolidated (2005+AMD1:2012+AMD2:2020+COR3:2022); 60601-1-2 Ed. 4.1 (2020)"
body = "IEC SC 62A"
source_file = "R5b"
trigger = "Any device with an applied part or mains/battery power sold or marketed as medical equipment."
applies_if = [ { field = "category", op = "eq", value = "medical" } ]
needs_human = "Accredited test lab, IECEE CB Scheme, EU notified body under the MDR."

[[standard]]
id = "iec-61508"
name = "IEC 61508 -- functional safety of E/E/PE safety-related systems"
edition = "Ed. 2.0 (2010-04-30); Ed. 3 at CDV stage, expected ~early 2027"
body = "IEC SC 65A"
source_file = "R5b"
trigger = "Any product where a control or protection function reduces risk (industrial/process safety functions)."
applies_if = [ { field = "has_safety_function", op = "true", value = true } ]
needs_human = "A functional-safety assessor / certification body (TUV, exida) for independent assessment."

[[standard]]
id = "iso-26262"
name = "ISO 26262 -- functional safety, road vehicles"
edition = "2nd edition (2018-12-17); 3rd-edition DIS registered 2026-08-04"
body = "ISO TC 22/SC 32"
source_file = "R5b"
trigger = "Any automotive electrical/electronic item or supplier component."
applies_if = [ { field = "category", op = "eq", value = "automotive" } ]
needs_human = "Confirmation reviews, functional-safety audits, independent assessor (I0-I3)."

[[standard]]
id = "ul94-flammability"
name = "UL 94 flammability rating (+ IEC 60695-11-10/-20 equivalents)"
edition = "UL 94 7th ed. (2023-02-28, rev. 2026-07-02); IEC 60695-11-10 Ed.2.0 (2013); -11-20 Ed.2.0 (2015)"
body = "UL Standards & Engagement / IEC TC 89"
source_file = "R5a"
trigger = "Enclosures, housings and internal plastic parts in electrical appliances and IT/AV equipment; called up by end-product standards such as 62368-1."
applies_if = [ { field = "has_plastic_enclosure", op = "true", value = true } ]
needs_human = "UL iQ Yellow Card lookup at actual wall thickness/colour; all testing and certification."

[[standard]]
id = "wcag22"
name = "WCAG 2.2 (= ISO/IEC 40500:2025)"
edition = "W3C Recommendation, updated 2024-12-12; ISO/IEC 40500:2025 (2nd ed., 2025-09-24)"
body = "W3C AG WG / ISO/IEC JTC 1"
source_file = "R5a"
trigger = "Public-sector websites, EU EN 301 549 / European Accessibility Act, ADA-related procurement, any product claiming accessibility conformance."
applies_if = [ { field = "has_web_or_app_ui", op = "true", value = true } ]
needs_human = "Keyboard/screen-reader walkthroughs, cognitive-criteria judgement, signing the conformance claim."

[[standard]]
id = "ipc-2221c"
name = "IPC-2221C -- generic PCB design rules"
edition = "Rev C (Dec 2023)"
body = "IPC (Global Electronics Association), task group D-31b"
source_file = "R5a"
trigger = "Any PCB design package or fabrication note."
applies_if = [ { field = "has_pcb", op = "true", value = true } ]
