[[standard]]
id = "ipc-a-610j"
name = "IPC-A-610J / J-STD-001J -- solder assembly acceptance"
edition = "Rev J (Mar/Apr 2024); Rev K in Final Draft for Industry Review as of R5a's access date"
body = "IPC committees 7-31b / 5-22a"
