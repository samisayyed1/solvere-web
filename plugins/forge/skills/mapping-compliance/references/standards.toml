# Standards applicability data (mapping-compliance skill).
#
# Every row's `edition`, `year` and `trigger` text traces to a specific
# Forge research file (R5a, R5b, R5e or R5f -- docs/research/R5f-compliance-data-gaps.md)
# -- never invented. `source_file` names exactly which one (or a list). Re-check `as_of` before trusting a row more than
# ~180 days old (R5e's own recommendation: "store dated snapshots, not
# 'current' claims").
#
# `applies_if`: a list of {field, op, value} predicates, ALL of which must
# hold against the product profile (compliance/product-profile.toml) for
# this standard to be flagged applicable. `op` is one of:
#   "eq"          profile field == value
#   "in"          profile field is a list containing value
#   "any_in"      profile field is a list sharing at least one item with the list value
#   "one_of"      profile field (a scalar) is one of the list value
#   "not_one_of"  profile field (a scalar) is present and not one of the list value
#   "true" / "false"  profile field is truthy / falsy
# verify.py normalises the profile first: power_source becomes a list,
# target_markets aliases (GB -> UK) are resolved, and has_radio defaults to
# whether `radios` is non-empty.
#
# Rows sourced from docs/research/R5f-compliance-data-gaps.md also carry
# `tag` ("V" verified on the primary source / "U" primary source not read),
# `source_url` and `human_confirms_applicability = true`: legal
# applicability is ALWAYS a qualified human's call, never Forge's. verify.py
# fails (data.rows_sourced) if an R5f row lacks any of these.
#
# The [[market]], [[power_source]], [[radio]] and [[radio_family]] tables
# are the only values verify.py accepts in the profile's target_markets,
# power_source and radios fields (FAIL-0001, FAIL-0002, FAIL-0004): a value
# outside them used to match nothing and pass silently.
#
# This file states which standards exist and why they might apply. It is
# NOT a compliance determination -- see mapping-compliance/SKILL.md and
# every generated report for the required disclaimer.

as_of = "2026-09-25"

[[standard]]
id = "iec-62368-1"
name = "IEC/EN/UL 62368-1 -- audio/video, IT and communications equipment safety"
edition = "IEC Ed. 4.0 (2023-05-26); EN IEC 62368-1:2024+A11:2024 (EU); UL 62368-1 Ed. 4 (2025-07-31, US/Canada)"
body = "IEC TC 108 / CENELEC / UL Standards & Engagement / CSA"
source_file = ["R5b", "R5f"]
source_url = "https://webstore.iec.ch/en/publication/69308 (Ed. 4.0 metadata); https://webstore.iec.ch/en/publication/27412 (scope sentence, Ed. 3.0 page)"
tag = "V"
human_confirms_applicability = true
trigger = "Any mains- or battery-powered AV/ICT product (chargers, PSUs, routers, sensors with a mains adapter) (R5b). Scope per the IEC abstract: AV, ICT and business/office equipment with a rated voltage not exceeding 600 V -- it names no power-source condition, so adapter-, USB- and battery-powered ICT equipment is a candidate too (R5f, FAIL-0004)."
applies_if = [ { field = "power_source", op = "any_in", value = ["mains", "external_adapter", "usb", "battery"] }, { field = "category", op = "not_one_of", value = ["medical", "automotive"] } ]
needs_human = "Confirm the product is AV/ICT equipment within scope (legal applicability). A test lab or certification body (NRTL, IECEE CB Scheme). In the EU, note the 2024 edition's OJ-harmonisation status is unresolved (R5b) -- ask a qualified human which edition to certify against. The external adapter itself needs its own evidence."

