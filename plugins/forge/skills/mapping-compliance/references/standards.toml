# ---------------------------------------------------------------------------
# Profile vocabularies (FAIL-0001, FAIL-0002, FAIL-0004). verify.py rejects
# any profile value not listed here, naming the valid ones.
# ---------------------------------------------------------------------------

# target_markets. Codes per ISO 3166-1 alpha-2 (US, CA assigned; EU and UK
# "exceptionally reserved"; GB is the assigned code for the UK, accepted as
# an alias) -- R5f [R], iso.org returned 403. Adding a market means adding
# sourced rows for it first.
[[market]]
code = "US"
name = "United States"
source_file = "R5f"

[[market]]
code = "CA"
name = "Canada"
source_file = "R5f"

[[market]]
code = "EU"
name = "European Union (single market)"
source_file = "R5f"

[[market]]
code = "UK"
name = "United Kingdom (GB rows; Northern Ireland follows separate rules)"
aliases = ["GB"]
source_file = "R5f"

# power_source values (a list; a legacy string such as "battery_and_mains"
# is split on "_and_").
[[power_source]]
id = "mains"
name = "connected directly to AC mains"

[[power_source]]
id = "external_adapter"
name = "powered from a separate external power supply / wall adapter"

[[power_source]]
id = "usb"
name = "powered over a USB connector (from a host or a USB wall adapter)"

[[power_source]]
id = "battery"
name = "internal battery (primary or rechargeable)"

# radios: Forge ids for the radio technologies the data file has rows for.
# A radio outside this list (5 GHz Wi-Fi, LTE, NFC, sub-GHz, ...) fails the
# check until sourced rows and an id are added here.
[[radio]]
id = "wifi_2g4"
family = "wifi"
name = "IEEE 802.11 Wi-Fi transmitting in 2400-2483.5 MHz"

[[radio]]
id = "ble"
family = "bluetooth"
name = "Bluetooth / Bluetooth LE (2.4 GHz)"

[[radio]]
id = "ieee802154_2g4"
family = "ieee802154"
name = "IEEE 802.15.4 (Thread, Zigbee) in the 2.4 GHz band"

[[radio]]
id = "radar_60ghz"
family = "radar"
name = "radar / field disturbance sensor in 57-64 GHz"

# radio_family: the requirements/params cross-check (FAIL-0002). A family
# is "named by the project" when ANY pattern (Python regex) matches the text
# of requirements/*.md or params/params.toml. The profile must then list a
# radio of that family in `radios`, or explain its absence in
# [radios_excluded] (e.g. a requirement that says the product shall NOT
# use Bluetooth). Patterns are deliberately narrow: "BLE" is upper-case
# whole-word only (so "table", "cable" never match), "Thread" is NOT matched
# (screw threads), and radar needs "radar", "mmWave", "FMCW" or a 57-64 GHz
# frequency.
[[radio_family]]
id = "wifi"
patterns = ['(?i)\bwi-?fi\b', '(?i)\b802\.11(?:[a-z]{1,2})?\b', '\bWLAN\b']

[[radio_family]]
id = "bluetooth"
patterns = ['(?i)\bbluetooth\b', '\bBLE\b']

[[radio_family]]
id = "ieee802154"
patterns = ['\b802\.15\.4\b', '(?i)\bzigbee\b']

[[radio_family]]
id = "radar"
patterns = ['(?i)\bradar\b', '(?i)\bmm-?wave\b', '\bFMCW\b', '(?i)\b(?:5[7-9]|6[0-4])(?:[.,]\d+)?\s?GHz\b']
