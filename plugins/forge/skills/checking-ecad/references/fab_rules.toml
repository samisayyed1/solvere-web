# Fab-house DFM minima, sourced number-by-number from docs/research/R5d-dfm-additive-snapfit-pcb.md
# ("PCB - JLCPCB" and "PCB - PCBWay" tables). Each key matches a field kicad-cli
# `pcb export stats --format json` reports under `.board`, so checking-ecad/scripts/verify.py
# can compare a board's *measured* minima directly against a fab's floor.
#
# These are each fab's STANDARD tier (not the costlier "advanced"/"high-precision" tier).
# If a product needs the tighter tier, add a profile below with its own sourced numbers --
# never edit a number here without updating the source comment.

[jlcpcb]
# JLCPCB has no separate "advanced" table; some options just cost more (R5d).
min_track_width_mm = 0.10        # "Trace/space, 1 oz, 1-2 layer: 0.10/0.10 mm (4/4 mil)" [V]
min_track_clearance_mm = 0.10    # same row
min_drill_diameter_mm = 0.30     # "Drill range: 1-layer 0.3-6.3 mm" [V] (2-layer/multilayer allows 0.15 mm, "more costly")
min_annular_ring_mm = 0.20       # "PTH annular ring: Headline >= 0.20 mm" [V]
copper_to_edge_mm = 0.20         # "Copper to routed edge / V-cut: >= 0.2 mm" [V]
source = "R5d PCB - JLCPCB table"

[pcbway]
min_track_width_mm = 0.10        # "Trace/space (standard): 0.1 mm / 4 mil" [V]
min_track_clearance_mm = 0.10    # same row
min_drill_diameter_mm = 0.15     # "Drill / finished hole: 0.15-6.0 mm" [V]
min_annular_ring_mm = 0.15       # "Min annular ring: 0.15 mm (6 mil) standard" [V]
copper_to_edge_mm = 0.25         # "Trace to board edge (CNC routing): 0.25 mm normal" [V]
source = "R5d PCB - PCBWay table"
