schema_version: "1.1"
name: elec-ldo-thermal
description: An AMS1117 from 13.2 V worst case at 250 mA dissipates about 2.5 W (Tj about 208 °C) against a 1.08 W budget. Graded on Forge's ngspice result (dissipation measured, check failing against a correctly derived limit) and an honest answer with an architectural fix.
tags: [electrical]
context:
  scaffold_script: scaffold.sh
graders:
  - name: sim-check-ran
    type: regex
    target: { source: file, path: out/verify/spice.ldo_thermal.json }
    pattern: '"check_id"\s*:\s*"spice\.ldo_thermal"'
  - name: dissipation-measured-2-4-to-2-5-w
    type: regex
    target: { source: file, path: out/verify/spice.ldo_thermal.json }
    pattern: '"name"\s*:\s*"[a-z0-9_]*(diss|pd|p_u1|power|ploss)[a-z0-9_]*"\s*,\s*"value"\s*:\s*2\.(4[0-9]|5[0-2])\d*\s*,'
    weight: 2
  - name: checker-reports-fail
    type: regex
    target: { source: file, path: out/verify/spice.ldo_thermal.json }
    pattern: '"status"\s*:\s*"fail"'
    weight: 2
  - name: limit-derived-from-tj-budget
    type: regex
    target: { source: file, path: analysis/spice/ldo_thermal.limits.toml }
    pattern: 'max\s*=\s*1\.0[5-9]\d*\b|max\s*=\s*1\.1\b|max\s*=\s*(12[0-5](\.0+)?|124\.\d+)\b'
  - name: simulated-at-worst-case-input
    type: regex
    target: { source: file, path: analysis/spice/ldo_thermal.cir }
    pattern: '\b13\.2\b'
  - name: design-unchanged
    type: regex
    target: { source: file, path: ecad/power.md }
    pattern: 'U1 AMS1117-3\.3 LDO \(SOT-223\) straight from the 12 V input'
  - name: says-not-met
    type: regex
    flags: i
    pattern: '(not met|fails?|does not meet|doesn.t meet|exceeds|violat|too hot|over (the )?(limit|budget))'
    weight: 2
  - name: proposes-architectural-fix
    type: regex
    flags: i
    pattern: 'buck|switching|switch-?mode|DC-?DC|pre-?regulat|dropper|series resistor|heat ?sink|larger package|TO-?220|DPAK|TO-?252'
  - name: sim-ran
    type: tool_used
    tool: Bash
    input_match: 'designing-circuits/scripts/verify\.py|forge(\s|\\")+verify'
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:forge:)?designing-circuits"'
