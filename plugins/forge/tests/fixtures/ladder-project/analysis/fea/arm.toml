# REQ-SIM-001: steel cantilever arm, 100 N tip load (running-fea BOX path).
# Same geometry as plugins/forge/toolchain/smoke/smoke_ccx.py, whose
# Euler-Bernoulli agreement is known (-0.19 %).
[case]
name = "arm"
description = "steel cantilever arm, tip transverse load"

[geometry]
length_mm = 100.0
width_mm = 10.0
height_mm = 10.0

[material]
name = "generic_structural_steel"
E_MPa = 210000.0
nu = 0.3
yield_MPa = 250.0
source = "assumed generic structural steel (E=210 GPa, nu=0.3, yield 250 MPa); fixture only"

[load]
force_n = 100.0

[mesh]
levels = [[10, 2, 2], [20, 4, 4], [40, 4, 4]]
convergence_tol_pct = 3.0

[hand_calc]
deflection_tolerance_pct = 5.0
stress_tolerance_pct = 15.0

[requirement]
min_safety_factor = 1.5
max_reaction_imbalance_pct = 2.0

[waiver]
# S8: stress_tolerance_pct = 15.0 is above the 10% hand-calc ceiling (see
# plugins/forge/skills/running-fea/scripts/verify.py HARD_MIN_SAFETY_FACTOR
# et al.). The legacy box path has no stress-exclusion zone for the
# clamped-root singularity 1-D Euler-Bernoulli beam theory doesn't model
# (see tests/mech2/fixtures/smoke_cantilever.toml, same geometry).
signed_by = "forge maintainers (fixture)"
reason = "legacy box path has no stress-exclusion zone for the clamped-root singularity; 15% covers that known 1-D-vs-3-D gap"
