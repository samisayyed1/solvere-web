[case]
name = "smoke_cantilever"
description = "steel cantilever beam, tip transverse load -- hand-check reference case"

[geometry]
length_mm = 100.0
width_mm = 10.0
height_mm = 10.0

[material]
name = "generic_structural_steel"
E_MPa = 210000.0
nu = 0.3
yield_MPa = 250.0
source = "assumed generic structural steel (E=210 GPa, nu=0.3); replace with a datasheet-backed value via intaking-datasheets before this case gates a real design"

[load]
force_n = 100.0

[mesh]
levels = [[10, 2, 2], [20, 4, 4], [40, 4, 4]]
convergence_tol_pct = 3.0

[hand_calc]
deflection_tolerance_pct = 5.0
stress_tolerance_pct = 15.0

[requirement]
min_safety_factor = 1.5
max_reaction_imbalance_pct = 2.0

[waiver]
# S8: stress_tolerance_pct = 15.0 is above the 10% hand-calc ceiling. The
# legacy box path (mesh_and_solve.py) has no stress-exclusion zones, so its
# single hand-calc stress comparison unavoidably includes the clamped-root
# singularity that 1-D Euler-Bernoulli beam theory does not model -- the
# general path (general_fea.py) handles this by excluding that zone
# instead (SKILL.md "Legacy box path"). Reference case measured +0.19%
# error in practice; 15% is slack for that known root effect, not doubt
# about the result.
signed_by = "forge maintainers (fixture)"
reason = "legacy box path has no stress-exclusion zone for the clamped-root singularity; 15% covers that known 1-D-vs-3-D gap, see SKILL.md Legacy box path"
