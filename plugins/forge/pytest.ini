[pytest]
# CONTRACTS.md §12/§9: the canonical full-suite runner is
#   ~/.forge/bin/forge-python -m pytest plugins/forge/tests -q -p no:cacheprovider
# run from the repo root. This file lets a bare `pytest` (or
# `uv run --with pytest pytest`) invoked from plugins/forge/ find the same
# suite, and pins collection behaviour so every test subdir's helpers
# (conftest.py fixtures + uniquely-named *util.py / _*.py helper modules)
# import without colliding across directories.
testpaths = tests
markers =
    slow: exercises a real external tool (CalculiX, freecadcmd, PyVista, Blender)
