# Linux only (ADR-001 §8.L): FreeCAD 1.1.3 from conda-forge. FreeCAD's official Linux build
# is an AppImage on GitHub releases; conda-forge ships the same 1.1.3 release. macOS keeps
# the brew cask. Installed to ~/.forge/envs/freecad.
[workspace]
name = "forge-freecad-env"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
freecad = "==1.1.3"
