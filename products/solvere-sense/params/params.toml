# Single source of truth for every dimension and value used in cad/, ecad/,
# firmware/ or analysis/ (CONTRACTS.md §2). Nothing is hard-coded in source.
#
# status: assumed | datasheet | measured | verified
# Changing a `status = "verified"` value needs `forge params set --justification "..."`;
# the PreToolUse hook blocks direct edits to verified params.
#
# Source short names (full citations in requirements/requirements.md):
#   Owner = docs/intake/G0-owner-answers.md (2026-09-25, L0)
#   DS    = Seeed MR60FDA2 industrial product datasheet, SKU 114993388, 8 pp.,
#           https://files.seeedstudio.com/Bazaar/product_pdf/114993388.pdf (read 2026-09-25) [V]
#   Wiki  = https://wiki.seeedstudio.com/getting_started_with_mr60fda2_mmwave_kit/
#           (source commit 880cf8b, 2026-05-15; read 2026-09-25) [V]
#   A-xxx = ASSUMPTIONS.md row
#
# G0 draft: no value here is measured or verified yet.

