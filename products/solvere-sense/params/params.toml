# Single source of truth for every dimension and value used in cad/, ecad/,
# firmware/ or analysis/ (CONTRACTS.md §2). Nothing is hard-coded in source.
#
# status: assumed | datasheet | measured | verified
# Changing a `status = "verified"` value needs `forge params set --justification "..."`;
# the PreToolUse hook blocks direct edits to verified params.
#
# Source short names (full citations in requirements/requirements.md; local
# copies with sha256 in docs/sources/README.md, all fetched 2026-09-25):
#   Owner = docs/intake/G0-owner-answers.md (2026-09-25, L0). Owner values are
#           requirements, not datasheet values, so they carry status "assumed".
#   Owner round 2 = docs/intake/G0-owner-answers-2.md (2026-09-25, L0 owner decision)
#   ARSDG = Apple Rubber Seal Design Guide, docs/sources/apple-rubber-seal-design-guide.pdf
#   DS    = Seeed MR60FDA2 kit industrial product datasheet, SKU 114993388, 8 pp., updated 2026-07-30
#   MDS   = Seeed MR60FDA2 module technical specification, Beta V1.0, 2024-03-05, 12 pp.
#   Wiki  = wiki.seeedstudio.com/getting_started_with_mr60fda2_mmwave_kit/ (last updated 2024-08-19)
#   XIAO  = wiki.seeedstudio.com/xiao_esp32c6_getting_started/ (last updated 2024-08-05)
#   FDA1  = wiki.seeedstudio.com/Radar_MR60FDA1/ (sibling module; assumptions only)
#   Web   = Seeed product page p-5946, read 2026-09-25
#   A-xxx = ASSUMPTIONS.md row; Q-xx = open question in reviews/G0.md
#
# G0 draft: no value here is measured or verified yet.
# Deliberately absent until G1/G2: enclosure wall thickness (bounded by
# mfg.fdm.min_wall; chosen at G1), radome thickness (needs er at 60 GHz from the
# TP-SYS-002 coupon test), O-ring cord cross-section and groove dimensions (chosen
# at G1 from ARSDG Table A, REQ-MECH-017), fixing sizes (Forge proposes at G1),
# every mass (nothing sourced; weigh the kit at G1), and the retention safety
# factor (due before G2, REQ-MECH-015), minimum pod spacing (from TP-SYS-003).

